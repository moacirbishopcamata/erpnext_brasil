[project]
name = "erpnext_brasil"
authors = [{ name = "ERPNext Brasil contributors" }]
description = "Localização fiscal brasileira para o ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0"
erpnext = ">=15.0.0"

# Mesmo estilo do erpnext (tab, aspas duplas), para que contribuições circulem entre
# os dois repositórios sem reformatação.
[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = ["E501", "W191", "E101", "B904", "RUF001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
