[project]
name = "erpnext_brasil"
authors = [{ name = "ERPNext Brasil contributors" }]
description = "Localização fiscal brasileira para o ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
# Piso deliberadamente aberto (sem teto) — este app usa APIs estáveis do Frappe
# (custom fields, doc_events, frappe.get_doc/get_meta), não internals que costumam
# quebrar entre majors. A versão **estável** mais recente confirmada é `version-16`
# (Frappe v16.53.0, ERPNext v16.52.1, HRMS v16.52.0, github.com/frappe/{frappe,erpnext,hrms}/releases,
# checado em 2026-10-26), e é nela que o bench de teste (WSL2, `~/frappe-bench-16`) roda desde a
# migração; o piso `>=15` é a promessa de compatibilidade, não algo exercitado hoje. Ver
# docs/versoes-frappe-erpnext.md e docs/atualizacao-do-bench-2026-10-26.md.
frappe = ">=15.0.0"
erpnext = ">=15.0.0"

# Mesmo estilo do erpnext (tab, aspas duplas), para que contribuições circulem entre
# os dois repositórios sem reformatação.
[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
# RUF001/002/003 são a mesma regra ("caractere ambíguo") aplicada a string, docstring e
# comentário. A prosa deste projeto é em português e usa tipografia de verdade: o `×` de
# "NF-e × CT-e" e o travessão `—` são escolhas deliberadas, não `x` e `-` digitados
# errado. Ignorar só RUF001 e deixar as duas irmãs ativas seria incoerente — a mesma
# frase passaria numa string e falharia numa docstring.
ignore = ["E501", "W191", "E101", "B904", "RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
