# CI do erpnext_brasil.
#
# Roda o que este projeto consegue rodar **sem bench**: a suíte pura (2.292 testes) e os
# padrões de código. É de propósito que não há job de bench aqui — montar site, MariaDB e
# Redis no CI é trabalho real, e prometer uma checagem que não existe é pior que declarar
# a lacuna. Ela está registrada em `docs/gaps.md`, seção 2.
#
# A arquitetura é o que torna isso possível: `fiscal/`, `contabil/` e `folha/` não importam
# `frappe`, e `tests/test_arquitetura.py` falha se alguém quebrar essa regra. Por isso a
# maior parte do projeto se testa com um `pip install ruff` e nada mais.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    name: Suíte pura
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # `lxml` é a única dependência da suíte pura: o leitor/assinador de XML a importa.
      # Num bench ela vem junto com o frappe; aqui, sem bench, precisa ser instalada —
      # sem isso 80 testes falham com `ModuleNotFoundError`.
      - name: Instalar lxml
        run: pip install lxml

      # A resolução real do Compose (tests/test_docker.py) só roda se houver Docker; o runner do GitHub tem.
      # Este passo falha se um dia não tiver, em vez de deixar a validação ser pulada em silêncio.
      - name: Docker disponível
        run: docker compose version

      - name: Rodar a suíte
        run: python -m unittest discover -s erpnext_brasil/tests -t .

      - name: Testes do módulo avulso Laboratório SUS (camada pura)
        run: python -m unittest discover -s sus_brasil/tests -t .

  padroes:
    name: Padrões de código
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar ruff
        run: pip install ruff

      # A configuração vive em `pyproject.toml`: linha de 110, tabulação, aspas duplas —
      # as mesmas do erpnext, para que quem vem de lá não estranhe.
      - name: ruff check
        run: ruff check erpnext_brasil/ scripts/ sus_brasil/

      - name: ruff format
        run: ruff format --check erpnext_brasil/ scripts/ sus_brasil/

  cherry:
    name: Cherry (núcleo, com cobertura)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar coverage
        run: pip install coverage

      # A interface (`test_app.py`) precisa de display: o `xvfb` dá um virtual, e o `python3-tk` traz as
      # bibliotecas do Tk. Sem isso o teste da interface pula e `app.py` fica com 0% (CH-06 da revisão do Cherry).
      - name: Instalar display virtual e Tk
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk

      - name: Testes do Cherry com cobertura
        run: |
          xvfb-run -a python -m coverage run --include="scripts/cherry/*.py" --omit="scripts/cherry/test_*.py,scripts/cherry/__main__.py,scripts/cherry/cherry.py" -m unittest scripts.cherry.test_config scripts.cherry.test_perfis scripts.cherry.test_instancias scripts.cherry.test_app

      # Dois pisos. O núcleo (`config.py` e `perfis.py`) é onde mora toda escrita de arquivo: 95%. A interface tem piso
      # próprio, dois pontos abaixo do medido (91% na `0.4.0`); se `test_app.py` pular por falta de display,
      # `app.py` cai a 0% e este passo falha — ver docs/cherry.md.
      - name: Piso de cobertura do núcleo
        run: python -m coverage report -m --include="scripts/cherry/config.py,scripts/cherry/perfis.py,scripts/cherry/instancias.py" --fail-under=95

      - name: Piso de cobertura da interface
        run: python -m coverage report -m --include="scripts/cherry/app.py" --fail-under=89
